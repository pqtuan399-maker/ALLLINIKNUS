name: NUS Kitchen Monitor
on:
  # Paused: notifications now come exclusively from approved CODE #8 events.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nus-kitchen-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch kitchen API and update shared history
        run: python nha-bep/monitor.py
      - name: Commit changes when snapshot changed
        run: |
          git config user.name "NUS Kitchen Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nha-bep/data/alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(kitchen): update centralized daily snapshot"
            git push
          fi
