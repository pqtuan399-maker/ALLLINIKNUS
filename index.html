<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Đăng ký bữa ăn</title>

  <!-- Giữ nguyên icon.png cũ để làm icon ngoài màn hình chính -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <meta name="apple-mobile-web-app-title" content="Đăng ký bữa ăn">
  <meta name="application-name" content="Đăng ký bữa ăn">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f7f8">

  <style>
    :root{
      --ink:#172129;
      --muted:#68747b;
      --green:#0b7d72;
      --green2:#19b59f;
      --red:#cc3038;
      --red2:#ff655d;
      --gold:#d4a646;
      --surface:rgba(255,255,255,.84);
      --line:rgba(25,35,42,.08);
      --shadow:0 26px 70px rgba(25,35,42,.15);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(26px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 8% 0%, rgba(25,181,159,.18), transparent 30%),
        radial-gradient(circle at 92% 6%, rgba(255,101,93,.16), transparent 28%),
        linear-gradient(160deg,#f4faf9 0%,#fff8f6 55%,#fffaf4 100%);
      overflow-x:hidden;
    }

    .app{
      width:100%;
      max-width:430px;
    }

    /* Một bề mặt liên tục duy nhất */
    .panel{
      position:relative;
      overflow:hidden;
      border-radius:36px;
      background:
        linear-gradient(
          180deg,
          rgba(22,181,159,.09) 0%,
          rgba(255,255,255,.88) 29%,
          rgba(255,255,255,.91) 62%,
          rgba(255,101,93,.09) 100%
        );
      border:1px solid rgba(255,255,255,.92);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .panel::before,
    .panel::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(2px);
      pointer-events:none;
      z-index:0;
    }

    .panel::before{
      width:230px;
      height:230px;
      left:-125px;
      top:170px;
      background:radial-gradient(circle,rgba(25,181,159,.18),transparent 68%);
    }

    .panel::after{
      width:250px;
      height:250px;
      right:-140px;
      bottom:30px;
      background:radial-gradient(circle,rgba(255,101,93,.16),transparent 68%);
    }

    .hero{
      position:relative;
      z-index:1;
      text-align:center;
      padding:24px 22px 18px;
    }

    .logo{
      width:104px;
      height:auto;
      display:block;
      margin:0 auto 10px;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.08));
    }

    h1{
      margin:0;
      font-size:30px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:-.035em;
    }

    .verse{
      margin:11px auto 0;
      max-width:338px;
      font-size:13px;
      line-height:1.45;
      color:#705b30;
      font-weight:600;
    }

    .verse b{
      color:#a97f2f;
      white-space:nowrap;
    }

    .flow{
      position:relative;
      z-index:1;
      padding:8px 16px 16px;
    }

    /* Trục nối 2 chức năng */
    .connector{
      position:absolute;
      left:60px;
      top:56px;
      bottom:56px;
      width:2px;
      background:linear-gradient(
        180deg,
        rgba(11,125,114,.35),
        rgba(212,166,70,.30),
        rgba(204,48,56,.35)
      );
      z-index:0;
    }

    .option{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:92px 1fr 40px;
      align-items:center;
      gap:14px;
      min-height:136px;
      padding:14px 12px;
      text-decoration:none;
      color:var(--ink);
      border-radius:26px;
      -webkit-tap-highlight-color:transparent;
      overflow:hidden;
      transition:
        transform .18s cubic-bezier(.2,.8,.2,1),
        background .18s ease;
    }

    .option + .option{
      margin-top:2px;
      border-top:1px solid var(--line);
      border-radius:0 0 26px 26px;
    }

    .option:active{
      transform:scale(.978);
      background:rgba(255,255,255,.58);
    }

    .icon-wrap{
      position:relative;
      display:grid;
      place-items:center;
    }

    .halo{
      position:absolute;
      width:108px;
      height:108px;
      border-radius:50%;
      opacity:.24;
      filter:blur(2px);
    }

    .regular .halo{
      background:radial-gradient(circle,rgba(25,181,159,.70),transparent 72%);
    }

    .urgent .halo{
      background:radial-gradient(circle,rgba(255,101,93,.65),transparent 72%);
    }

    .app-icon{
      position:relative;
      width:86px;
      height:86px;
      object-fit:cover;
      border-radius:22px;
      display:block;
      box-shadow:
        0 11px 24px rgba(20,30,36,.18),
        0 0 0 4px rgba(255,255,255,.65);
      transition:transform .18s ease;
    }

    .option:active .app-icon{
      transform:scale(.95) rotate(-1deg);
    }

    .copy{
      min-width:0;
    }

    .kicker{
      margin-bottom:5px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    .regular .kicker{color:var(--green)}
    .urgent .kicker{color:var(--red)}

    .title{
      margin:0;
      font-size:22px;
      line-height:1.08;
      font-weight:900;
      letter-spacing:-.025em;
    }

    .badge{
      margin-top:9px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      line-height:1;
      color:#fff;
      box-shadow:0 8px 18px rgba(20,30,36,.10);
    }

    .regular .badge{
      background:linear-gradient(135deg,var(--green),var(--green2));
    }

    .urgent .badge{
      background:linear-gradient(135deg,var(--red),var(--red2));
    }

    .dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#fff;
      animation:pulse 1.8s infinite;
    }

    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}
      70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}
      100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
    }

    .arrow{
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:25px;
      font-weight:600;
      background:rgba(255,255,255,.72);
      box-shadow:0 8px 18px rgba(20,30,36,.08);
      transition:transform .18s ease,background .18s ease;
    }

    .regular .arrow{color:var(--green)}
    .urgent .arrow{color:var(--red)}

    .option:active .arrow{
      transform:translateX(5px);
      background:#fff;
    }

    .footer{
      position:relative;
      z-index:1;
      padding:4px 16px 17px;
      text-align:center;
      color:#8a9499;
      font-size:10.5px;
      font-weight:700;
    }

    .ripple{
      position:absolute;
      border-radius:50%;
      transform:scale(0);
      animation:ripple .55s linear;
      background:rgba(255,255,255,.50);
      pointer-events:none;
      z-index:9;
    }

    @keyframes ripple{
      to{
        transform:scale(4);
        opacity:0;
      }
    }

    @media (hover:hover){
      .option:hover{
        background:rgba(255,255,255,.46);
      }

      .option:hover .app-icon{
        transform:scale(1.035);
      }

      .option:hover .arrow{
        transform:translateX(4px);
        background:#fff;
      }
    }

    @media (max-width:380px){
      .option{
        grid-template-columns:80px 1fr 36px;
        gap:11px;
        min-height:122px;
      }

      .app-icon{
        width:76px;
        height:76px;
        border-radius:20px;
      }

      .halo{
        width:96px;
        height:96px;
      }

      .connector{
        left:52px;
      }

      .title{font-size:19px}
      h1{font-size:27px}
      .logo{width:94px}
    }

    @media (prefers-reduced-motion:reduce){
      *{
        animation:none!important;
        transition:none!important;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="panel">

      <div class="hero">
        <img
          class="logo"
          src="logo-nha-ung-sinh.png"
          alt="Nhà Ứng Sinh Thánh Gioan Hà Nội"
        >

        <h1>Đăng ký bữa ăn</h1>

        <div class="verse">
          “Xin Cha cho chúng con hôm nay lương thực hằng ngày.”
          <b>Mt 6,11</b>
        </div>
      </div>

      <div class="flow">
        <div class="connector"></div>

        <a
          class="option regular"
          href="https://docs.google.com/spreadsheets/d/1YjmqfspA-z4t9EUj3T-1Q9Of86M6SQ-_jcnupS_a6D4/edit?gid=596498506#gid=596498506"
          aria-label="Đăng ký thường"
        >
          <div class="icon-wrap">
            <span class="halo"></span>
            <img
              class="app-icon"
              src="icon-dang-ky-thuong.png"
              alt="Đăng ký cơm NUS"
            >
          </div>

          <div class="copy">
            <div class="kicker">Đăng ký bữa ăn</div>
            <h2 class="title">Đăng ký thường</h2>
            <div class="badge">
              <span class="dot"></span>
              21h15 khóa đăng ký
            </div>
          </div>

          <div class="arrow">›</div>
        </a>

        <a
          class="option urgent"
          href="https://script.google.com/macros/s/AKfycbzpOs90RGEH_HZWfNnNBtz2ybjnLrcAsZD82lQO06pz_T9vGPXEbZHkhV1ia-3oCCKh/exec"
          aria-label="Đăng ký đột xuất"
        >
          <div class="icon-wrap">
            <span class="halo"></span>
            <img
              class="app-icon"
              src="icon-dang-ky-dot-xuat.png"
              alt="Đăng ký đột xuất"
            >
          </div>

          <div class="copy">
            <div class="kicker">Đăng ký bữa ăn</div>
            <h2 class="title">Đăng ký đột xuất</h2>
            <div class="badge">
              <span class="dot"></span>
              Chú ý mã OTP
            </div>
          </div>

          <div class="arrow">›</div>
        </a>
      </div>

      <div class="footer">Chạm vào lựa chọn để mở hệ thống</div>

    </section>

  </main>

  <script>
    document.querySelectorAll('.option').forEach(card => {
      card.addEventListener('pointerdown', function(e) {
        const old = this.querySelector('.ripple');
        if (old) old.remove();

        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');

        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

</body>
</html>
