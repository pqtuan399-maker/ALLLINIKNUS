<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Đăng ký bữa ăn</title>

  <!-- Giữ nguyên icon.png cũ trong repo để làm icon ngoài màn hình chính -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="Đăng ký bữa ăn">
  <meta name="application-name" content="Đăng ký bữa ăn">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F5F6F8">

  <style>
    :root{
      --bg:#f4f6f8;
      --ink:#172126;
      --muted:#6d777c;
      --green1:#0a7a6f;
      --green2:#19a18f;
      --red1:#c62e35;
      --red2:#ef5350;
      --gold:#cda545;
      --white:#ffffff;
      --line:#e9edef;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at top left, rgba(25,161,143,.10), transparent 30%),
        radial-gradient(circle at top right, rgba(239,83,80,.08), transparent 28%),
        var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:
        max(22px, env(safe-area-inset-top))
        16px
        max(24px, env(safe-area-inset-bottom));
    }

    .app{
      width:100%;
      max-width:430px;
    }

    .header{
      text-align:center;
      padding:8px 8px 18px;
    }

    .logo{
      width:104px;
      max-width:46%;
      height:auto;
      display:block;
      margin:0 auto 10px;
    }

    .house{
      margin:0;
      color:#7f252c;
      font-size:12px;
      font-weight:800;
      line-height:1.35;
    }

    h1{
      margin:8px 0 0;
      font-size:31px;
      line-height:1.08;
      font-weight:850;
      letter-spacing:-.03em;
    }

    .verse{
      margin:13px auto 0;
      max-width:360px;
      color:#7a6435;
      font-size:13px;
      line-height:1.45;
    }

    .verse b{
      color:#a17b2d;
      white-space:nowrap;
    }

    .cards{
      display:grid;
      gap:14px;
    }

    .card{
      position:relative;
      display:block;
      min-height:176px;
      padding:22px;
      border-radius:30px;
      color:#fff;
      text-decoration:none;
      overflow:hidden;
      box-shadow:0 18px 44px rgba(20,32,38,.13);
      -webkit-tap-highlight-color:transparent;
      transition:transform .15s ease, box-shadow .15s ease;
    }

    .card:active{
      transform:scale(.985);
      box-shadow:0 10px 28px rgba(20,32,38,.11);
    }

    .regular{
      background:
        radial-gradient(circle at 95% 5%, rgba(255,255,255,.22), transparent 26%),
        linear-gradient(135deg,var(--green1),var(--green2));
    }

    .urgent{
      background:
        radial-gradient(circle at 95% 5%, rgba(255,255,255,.20), transparent 26%),
        linear-gradient(135deg,var(--red1),var(--red2));
    }

    .card::after{
      content:"";
      position:absolute;
      width:170px;
      height:170px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:50%;
      right:-66px;
      bottom:-92px;
    }

    .icon{
      width:54px;
      height:54px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.17);
      border:1px solid rgba(255,255,255,.22);
      margin-bottom:18px;
      backdrop-filter:blur(6px);
    }

    .icon svg{
      width:30px;
      height:30px;
      stroke:#fff;
    }

    .card-title{
      margin:0;
      font-size:24px;
      line-height:1.1;
      font-weight:850;
      letter-spacing:-.02em;
    }

    .card-note{
      margin:8px 0 0;
      font-size:13px;
      font-weight:700;
      color:rgba(255,255,255,.88);
    }

    .go{
      position:absolute;
      right:20px;
      top:50%;
      transform:translateY(-50%);
      width:44px;
      height:44px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.20);
      font-size:27px;
      line-height:1;
      font-weight:700;
    }

    .footer{
      padding:18px 10px 2px;
      text-align:center;
      color:#9aa2a6;
      font-size:11px;
    }

    @media (max-width:360px){
      h1{font-size:27px}
      .card{min-height:164px}
      .card-title{font-size:22px}
      .logo{width:92px}
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <img class="logo" src="logo-nha-ung-sinh.png" alt="Nhà Ứng Sinh Thánh Gioan Hà Nội">

      <p class="house">NHÀ ỨNG SINH THÁNH GIOAN HÀ NỘI</p>

      <h1>Đăng ký bữa ăn</h1>

      <p class="verse">
        “Xin Cha cho chúng con hôm nay lương thực hằng ngày.”
        <b>Mt 6,11</b>
      </p>
    </header>

    <section class="cards">

      <a
        class="card regular"
        href="https://docs.google.com/spreadsheets/d/1YjmqfspA-z4t9EUj3T-1Q9Of86M6SQ-_jcnupS_a6D4/edit?gid=596498506#gid=596498506"
      >
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 11h14"/>
            <path d="M6 11c0 4 2.5 7 6 7s6-3 6-7"/>
            <path d="M7 18h10"/>
            <path d="M9 5c0 1 .8 1.5 1.4 2.1C11 7.7 11 8.4 11 9"/>
            <path d="M13 4c0 1 .8 1.5 1.4 2.1C15 6.7 15 7.4 15 8"/>
          </svg>
        </div>

        <h2 class="card-title">Đăng ký thường</h2>
        <p class="card-note">21h15 khóa đăng ký</p>

        <div class="go">›</div>
      </a>

      <a
        class="card urgent"
        href="https://script.google.com/macros/s/AKfycbzpOs90RGEH_HZWfNnNBtz2ybjnLrcAsZD82lQO06pz_T9vGPXEbZHkhV1ia-3oCCKh/exec"
      >
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
            <path d="M10.3 3.7 2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/>
          </svg>
        </div>

        <h2 class="card-title">Đăng ký đột xuất</h2>
        <p class="card-note">Dành cho trường hợp phát sinh</p>

        <div class="go">›</div>
      </a>

    </section>

    <div class="footer">Nhà Ứng Sinh Thánh Gioan Hà Nội</div>

  </main>
</body>
</html>
